<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Keranjang Belanja - NOVELKU</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/keranjang.css}" />
    <link rel="stylesheet" th:href="@{/css/navbar.css}" />
    <link rel="stylesheet" th:href="@{/css/index.css}" />
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div th:if="${#lists.isEmpty(cartItems)}" class="empty-cart-container">
        <i class="bi bi-cart-x" style="font-size: 5rem; color: #ccc;"></i>
        <h4 class="mt-4">Keranjang Anda Masih Kosong</h4>
        <p class="text-muted">Sepertinya Anda belum menambahkan novel apa pun ke keranjang.</p>
        <a th:href="@{/index}" class="checkout-btn mt-3">Mulai Belanja</a>
    </div>

    <div th:if="${not #lists.isEmpty(cartItems)}" class="cart-page-wrapper">

        <div class="cart-items-list">
            <h3 style="font-weight: 600; color: #333;">Keranjang Buku Anda</h3>
            <div th:each="item : ${cartItems}" class="cart-item">
                <img th:src="${item.novel.coverUrl}" alt="Sampul Buku">
                <div class="cart-details">
                    <div>
                        <div class="cart-title" th:text="${item.novel.judul}">Judul Novel</div>
                        <div class="cart-author" th:text="'by ' + ${item.novel.penulis}">by Penulis</div>
                    </div>
                    <div class="cart-price">
                        <del th:if="${item.novel.diskon > 0}" th:text="${item.getFormattedOriginalHarga()}"
                            style="color: #888; margin-right: 8px; font-size: 0.9em;"></del>
                        <span th:text="${item.getFormattedHargaSetelahDiskon()}"></span>
                    </div>
                </div>
                <div class="cart-actions">
                    <div class="input-group">
                        <form
                            th:action="@{/keranjang/kurangSatu/{novelId}(novelId=${T(Kelompok5.PBO.Novel_Web.core.Main).getAllNovels().indexOf(item.novel)})}"
                            method="post" class="m-0">
                            <button type="submit" class="btn btn-outline-dark">-</button>
                        </form>
                        <input type="text" class="form-control text-center px-2" th:value="${item.quantity}" readonly
                            style="max-width: 45px; background-color: #f8f9fa; border-color: #dee2e6;">
                        <form
                            th:action="@{/keranjang/tambahSatu/{novelId}(novelId=${T(Kelompok5.PBO.Novel_Web.core.Main).getAllNovels().indexOf(item.novel)})}"
                            method="post" class="m-0">
                            <button type="submit" class="btn btn-outline-dark">+</button>
                        </form>
                    </div>
                    <form
                        th:action="@{/keranjang/hapus/{novelId}(novelId=${T(Kelompok5.PBO.Novel_Web.core.Main).getAllNovels().indexOf(item.novel)})}"
                        method="post" class="mt-2">
                        <button type="submit" class="btn-remove"><i class="bi bi-trash"></i> Hapus</button>
                    </form>
                </div>
            </div>
        </div>

        <aside class="order-summary">
            <h3>Ringkasan Pesanan</h3>
            <div class="summary-row">
                <span>Total</span>
                <span th:text="${totalFormatted}">Rp0</span>
            </div>
            <button class="checkout-btn">Lanjut ke Pembayaran</button>
        </aside>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
