<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Keranjang Buku Interaktif</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/keranjang.css}" />
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="cart-container">
        <h3 class="mb-4">Keranjang Buku Anda</h3>

        <div th:if="${#lists.isEmpty(cartItems)}" class="text-center p-5">
            <h4>Keranjang Anda masih kosong.</h4>
            <a th:href="@{/index}" class="btn checkout-btn mt-3">Mulai Belanja</a>
        </div>

        <div id="cart-items" th:if="${not #lists.isEmpty(cartItems)}">
            <div th:each="item : ${cartItems}" class="cart-item">
                <img th:src="${item.novel.coverUrl}" alt="Sampul Buku" style="width: 80px; height: 120px; object-fit: cover;">
                <div class="cart-details">
                    <div class="cart-title" th:text="${item.novel.judul}">Judul Novel</div>
                    <div class="text-muted" th:text="'by ' + ${item.novel.penulis}">by Penulis</div>
                    <div class="cart-price" th:text="${item.getFormattedHarga()}">Rp0</div>
                </div>
                
                <div class="d-flex align-items-center" style="gap: 1rem;">
                    <div class="input-group w-auto">
                        <form th:action="@{/keranjang/kurangSatu/{novelId}(novelId=${T(Kelompok5.PBO.Novel_Web.core.Main).getAllNovels().indexOf(item.novel)})}" method="post" class="m-0">
                            <button type="submit" class="btn btn-outline-secondary" style="border-top-right-radius: 0; border-bottom-right-radius: 0;">-</button>
                        </form>
                        
                        <input type="text" class="form-control text-center px-2" th:value="${item.quantity}" readonly style="max-width: 45px; background-color: white; border-left: 0; border-right: 0;">
                        
                        <form th:action="@{/keranjang/tambahSatu/{novelId}(novelId=${T(Kelompok5.PBO.Novel_Web.core.Main).getAllNovels().indexOf(item.novel)})}" method="post" class="m-0">
                            <button type="submit" class="btn btn-outline-secondary" style="border-top-left-radius: 0; border-bottom-left-radius: 0;">+</button>
                        </form>
                    </div>

                    <form th:action="@{/keranjang/hapus/{novelId}(novelId=${T(Kelompok5.PBO.Novel_Web.core.Main).getAllNovels().indexOf(item.novel)})}" method="post">
                        <button type="submit" class="btn btn-link text-danger text-decoration-none p-0"><i class="bi bi-trash"></i> Hapus</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="total-section mt-4" th:if="${not #lists.isEmpty(cartItems)}">
            <h5>Total: <span id="cart-total" class="cart-price" th:text="${totalFormatted}">Rp0</span></h5>
            <button class="checkout-btn mt-2">Checkout</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
