<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${novel != null ? novel.judul : 'Detail Novel'} + ' - NOVELKU'">Detail Novel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/index.css}" />
    <link rel="stylesheet" th:href="@{/css/navbar.css}" />
    <link rel="stylesheet" th:href="@{/css/layout.css}" />

    <style>
        .detail-page-body {
            background-color: #f5f3eb;
            padding-top: 0px;
        }

        .detail-container {
            display: flex;
            gap: 3rem;
            max-width: 1200px;
            margin: 2rem auto;
            padding: 2.5rem;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .detail-cover {
            position: relative;
        }

        .detail-cover img {
            width: 300px;
            border-radius: 10px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
        }

        .detail-info {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .detail-info h1 {
            font-size: 2.8rem;
            font-weight: 700;
            color: #333;
            line-height: 1.2;
        }

        .detail-info .author {
            font-size: 1.2rem;
            color: #777;
            margin-bottom: 1.5rem;
        }

        .detail-info .description {
            color: #555;
            line-height: 1.8;
            margin-bottom: 1.5rem;
        }

        /* GAYA UNTUK SPESIFIKASI NOVEL */
        .novel-specs {
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            padding: 1.5rem 0;
            margin-bottom: 1.5rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
        }

        .spec-item .spec-label {
            font-size: 0.9rem;
            color: #888;
            display: block;
        }

        .spec-item .spec-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
        }

        .detail-actions {
            margin-top: auto;
            padding-top: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price-wrapper .price-label {
            font-size: 0.9rem;
            color: #888;
        }

        .price-wrapper .price {
            font-size: 2.2rem;
            font-weight: bold;
            color: #c19759;
            line-height: 1;
            display: inline;
        }

        .price-wrapper .original-price {
            font-size: 1.2rem;
            color: #aaa;
            margin-right: 0.75rem;
            text-decoration: line-through;
        }

        .buttons-wrapper {
            display: flex;
            gap: 0.75rem;
        }

        .discount-badge {
            position: absolute;
            top: 20px;
            left: -10px;
            background-color: #e74c3c;
            color: white;
            padding: 7px 15px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            transform: rotate(-10deg);
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body class="detail-page-body">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-content">
        <div class="detail-container" th:if="${novel != null}">
            <div class="detail-cover">
                <img th:src="${novel.coverUrl}" th:alt="${novel.judul}">
                <div class="discount-badge" th:if="${novel.diskon > 0}" th:text="'-' + ${novel.diskon} + '%'"></div>
            </div>
            <div class="detail-info">
                <div>
                    <h1 th:text="${novel.judul}">Judul Novel</h1>
                    <p class="author" th:text="'by ' + ${novel.penulis}">Penulis</p>
                    <p class="description" th:text="${novel.deskripsi}">Deskripsi novel.</p>
                </div>

                <div class="novel-specs">
                    <div class="spec-item">
                        <span class="spec-label">Genre</span>
                        <span class="spec-value" th:text="${novel.genre}">-</span>
                    </div>
                    <div class="spec-item">
                        <span class="spec-label">Tahun Terbit</span>
                        <span class="spec-value" th:text="${novel.tahunTerbit}">-</span>
                    </div>
                    <div class="spec-item">
                        <span class="spec-label">Jumlah Halaman</span>
                        <span class="spec-value" th:text="${novel.jumlahHalaman} + ' Halaman'">-</span>
                    </div>
                </div>

                <div class="detail-actions">
                    <div class="price-wrapper">
                        <span class="price-label">Harga</span>
                        <div>
                            <del class="original-price" th:if="${novel.diskon > 0}"
                                th:text="${novel.getFormattedOriginalHarga()}"></del>
                            <p class="price" th:text="${novel.getFormattedHargaSetelahDiskon()}"></p>
                        </div>
                    </div>
                    <div class="buttons-wrapper">
                        <button class="icon-btn like-btn" title="Suka" th:data-novel-id="${novelId}"
                            th:classappend="${isLiked} ? 'liked'">
                            <i class="fas fa-heart"></i>
                        </button>
                        <button class="icon-btn add-to-cart-btn" title="Tambah ke Keranjang"
                            th:data-novel-id="${novelId}">
                            <i class="fas fa-cart-plus"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <div id="toast-notification" class="toast-notification"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script th:src="@{/js/interactive-buttons.js}"></script>

</body>

</html>
