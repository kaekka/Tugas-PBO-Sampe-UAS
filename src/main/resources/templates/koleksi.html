<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Koleksi Favorit - NOVELKU</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/navbar.css}" />
    <link rel="stylesheet" th:href="@{/css/koleksi.css}" />
    <link rel="stylesheet" th:href="@{/css/index.css}" />
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container my-5">
        <h1 class="mb-4 text-center section-title-koleksi">Koleksi Novel Favorit Anda</h1>
        <div class="row g-4">
            <div th:style="${not #lists.isEmpty(novelViews)} ? 'display:none;' : ''" class="col-12 text-center empty-collection" id="empty-collection-message">
                <i class="far fa-heart empty-icon"></i>
                <p class="fs-4 mt-3">Koleksi favorit Anda masih kosong.</p>
                <a th:href="@{/index}" class="btn btn-novel mt-3">Mulai Menjelajah</a>
            </div>
            <th:block th:each="novelView : ${novelViews}">
                <div class="col-lg-3 col-md-4 col-sm-6">
                    <div class="card book-card-koleksi h-100">
                        <img th:src="${novelView.novel.coverUrl}" class="book-cover" th:alt="${novelView.novel.judul}">
                        <div class="card-overlay">
                            <h5 class="overlay-title" th:text="${novelView.novel.judul}"></h5>
                            <p class="overlay-author" th:text="${novelView.novel.penulis}"></p>
                            <div class="overlay-buttons">
                                <button class="btn btn-sm btn-action like-btn liked" title="Suka" th:data-novel-id="${novelView.id}">
                                    <i class="fas fa-heart"></i>
                                </button>
                                <button class="btn btn-sm btn-action add-to-cart-btn" title="Tambah ke Keranjang" th:data-novel-id="${novelView.id}">
                                    <i class="fas fa-cart-plus"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </th:block>
        </div>
    </div>
    <div id="toast-notification" class="toast-notification"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script th:src="@{/js/interactive-buttons.js}"></script>
</body>
</html>
